<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #e96cff, #5edfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #8899aa;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .message-box {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 500;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      transition: background 0.3s, border-color 0.3s;
      margin-bottom: 20px;
    }

    .message-box.win  { border-color: #5eff9c55; background: rgba(94,255,156,0.12); color: #5eff9c; }
    .message-box.lose { border-color: #ff5e5e55; background: rgba(255,94,94,0.10); color: #ff8888; }
    .message-box.tie  { border-color: #ffcc5e55; background: rgba(255,204,94,0.08); color: #ffcc5e; }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: #5edfff; }
    input[type="text"]::placeholder { color: #556677; }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    #play-btn {
      background: linear-gradient(135deg, #5edfff, #7b5ea7);
      color: #fff;
    }

    #home-btn {
      width: 100%;
      background: rgba(255,255,255,0.08);
      color: #ccc;
      border: 1px solid rgba(255,255,255,0.12);
      margin-top: 12px;
    }

    #home-btn:hover { background: rgba(255,255,255,0.13); }
  </style>
</head>
<body>
  <div class="card">
    <h1>✊ Rock Paper Scissors</h1>
    <p class="subtitle">Type rock, paper, or scissors — or something else...</p>

    <div class="message-box" id="message">Make your move!</div>

    <div class="input-row">
      <input type="text" id="choice-input" placeholder="rock, paper, or scissors…" autocomplete="off" />
      <button id="play-btn">Throw</button>
    </div>

    <button id="home-btn" onclick="location.href='/'">← Back to Games</button>
  </div>

  <script>
    const choiceInput = document.getElementById("choice-input");
    const playBtn     = document.getElementById("play-btn");
    const messageBox  = document.getElementById("message");

    function setMessage(text, status) {
      messageBox.textContent = text;
      messageBox.className = "message-box " + (status || "");
    }

    async function submitChoice() {
      const val = choiceInput.value.trim();
      if (!val) return;

      choiceInput.value = "";
      choiceInput.focus();

      let data;
      try {
        const res = await fetch("/rps/play", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ choice: val })
        });
        data = await res.json();
      } catch {
        setMessage("Something went wrong. Try again.", "lose");
        return;
      }

      setMessage(data.message, data.status);
    }

    playBtn.addEventListener("click", submitChoice);
    choiceInput.addEventListener("keydown", e => { if (e.key === "Enter") submitChoice(); });
    choiceInput.focus();
  </script>
</body>
</html>
